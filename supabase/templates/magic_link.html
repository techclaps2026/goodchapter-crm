<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in to The Good Chapter</title>
  </head>
  <body style="margin: 0; padding: 32px 16px; background: #f4f2ed; color: #23211f; font-family: Arial, sans-serif">
    <main style="max-width: 480px; margin: auto; padding: 32px; background: #fff; border: 1px solid #dedbd4">
      <p style="font-size: 12px; letter-spacing: 3px; font-weight: 700">THE GOOD CHAPTER</p>
      <h1 style="font-size: 26px; margin: 24px 0 12px">Welcome back to the studio.</h1>
      <p>Use this link to sign in to The Good Chapter CRM. It expires in one hour.</p>
      <p style="margin: 32px 0">
        <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&amp;type=email" style="display: inline-block; padding: 14px 20px; background: #23211f; color: #fff; text-decoration: none">Sign in to the studio</a>
      </p>
      <p style="font-size: 12px; color: #706d67">If you did not request this link, you can ignore this email.</p>
    </main>
  </body>
</html>

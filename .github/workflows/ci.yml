name: CRM checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:db
      - run: npm run build
      - run: npm run typecheck
      # Audit shipped dependencies; the unpatched braces advisory is in ESLint's dev-only tree.
      - run: npm audit --omit=dev --audit-level=high
